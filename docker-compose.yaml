services:
  gig-backend:
    build: .
    image: gig-backend:latest
    container_name: gig-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    # make sure your app uses this URI or set it in .env
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/yourdb}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://begiggle.keydraft.com,https://www.begiggle.keydraft.com,http://begiggle.keydraft.com,http://www.begiggle.keydraft.com}
    volumes:
      - .misc/logger:/app/logger/
      # Mount Google credentials (optional - can also use secrets)
      - ./service_account.json:/app/service_account.json:ro
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json:ro
    networks:
      - backend_net

networks:
  backend_net:
    external: true   # use the same network created by the DB stack
    name: backend_net
